[workspace]
resolver = "2"
members = [
    "crates/ms-protocol",
    "crates/ms-keymap",
    "crates/ms-security",
    "crates/ms-discovery",
    "crates/ms-config",
    "crates/ms-input-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mouse Share Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
mdns-sd = "0.13"
keyring = "3"
directories = "5"
toml = "0.8"
