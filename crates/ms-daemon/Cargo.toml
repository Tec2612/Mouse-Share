[package]
name = "ms-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mouse-share-daemon"
path = "src/main.rs"

[dependencies]
ms-protocol = { path = "../ms-protocol" }
ms-keymap = { path = "../ms-keymap" }
ms-security = { path = "../ms-security" }
ms-discovery = { path = "../ms-discovery" }
ms-config = { path = "../ms-config" }
ms-input-core = { path = "../ms-input-core" }
ms-core-service = { path = "../ms-core-service" }
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
directories.workspace = true
serde.workspace = true
serde_json = "1"

[target.'cfg(windows)'.dependencies]
ms-input-windows = { path = "../ms-input-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
ms-input-macos = { path = "../ms-input-macos" }
