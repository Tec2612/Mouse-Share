[package]
name = "mouse-share-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "mouse_share_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ms-protocol = { path = "../../crates/ms-protocol" }
ms-security = { path = "../../crates/ms-security" }
ms-discovery = { path = "../../crates/ms-discovery" }
ms-config = { path = "../../crates/ms-config" }
ms-core-service = { path = "../../crates/ms-core-service" }
ms-daemon = { path = "../../crates/ms-daemon" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "mouse-share"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
ms-input-macos = { path = "../../crates/ms-input-macos" }
